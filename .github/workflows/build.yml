name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: swift test
      - name: Live tests
        if: github.event_name == 'workflow_dispatch'
        env:
          LIVE_TESTS: "1"
        run: swift test --filter LiveTests 2>&1 | tail -150
      - name: Fetch fpcalc (Chromaprint, for AcoustID)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor/dl
          for tag in $(gh release list -R acoustid/chromaprint --limit 10 --json tagName -q '.[].tagName'); do
            if gh release download "$tag" -R acoustid/chromaprint --pattern '*fpcalc*macos*' -D vendor/dl 2>/dev/null; then
              echo "Using Chromaprint $tag"; break
            fi
          done
          ls -l vendor/dl
          for f in vendor/dl/*.tar.gz; do tar -xzf "$f" -C vendor/dl; done
          best=""
          for f in $(find vendor/dl -type f -name fpcalc); do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            if [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]; then best="$f"; break; fi
            [ -z "$best" ] && best="$f"
          done
          if [ -n "$best" ]; then cp "$best" vendor/fpcalc; chmod +x vendor/fpcalc; vendor/fpcalc -version || true; fi
      - name: Build universal app
        run: tools/bundle.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*.zip

  release:
    # Every push to main publishes (or refreshes) the release for the version in VERSION.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: iPod Manager ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            Universal macOS app (Apple Silicon and Intel), macOS 14 or later.
            Unpack the `.zip` and move "iPod Manager" to Applications. First launch: right-click → Open (the app is not notarized).
      - name: Keep only the three newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | sort -V -r | tail -n +4 \
            | while read -r tag; do
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
